name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - feature/auth
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Typecheck, lint and production build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # package-lock.json is currently only on the developer machine.
      # Switch to npm ci as soon as it is committed to the feature branch.
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
