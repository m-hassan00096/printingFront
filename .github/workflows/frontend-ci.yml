name: Frontend CI

on:
  push:
    branches:
      - main
      - develop
      - feature/auth
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    name: Typecheck, lint and production build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Temporary: the committed legacy lockfile is incompatible with npm 10 resolution.
      # Regenerate and commit a synchronized lockfile before merging.
      - run: npm install --global npm@11
      - run: rm -f package-lock.json && npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Commit synchronized lockfile to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/auth'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(deps): synchronize Auth dependency lockfile"
            git push origin HEAD:feature/auth
          fi
