name: One-time Auth Lockfile Repair

on:
  push:
    branches:
      - feature/auth

permissions:
  contents: write

jobs:
  normalize:
    if: github.event.head_commit.message == 'chore(auth): normalize lockfile via CI'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate a clean lockfile and verify it with npm ci
        run: |
          rm package-lock.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Commit exact dependency graph to feature/auth
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet || git commit -m "chore(deps): synchronize lockfile with Auth integration tests"
          git push origin HEAD:feature/auth
